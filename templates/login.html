{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-card">
    <h2>Login</h2>

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" style="background: green;">Login</button>
    </form>
</div>

{% endblock %}
